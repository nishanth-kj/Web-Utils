name: Pull Request
description: Propose a change to the repository.
title: "[PR]: "
labels: ["pr"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear summary of your changes and the motivation behind them.
    validations:
      required: true

  - type: input
    id: related_issue
    attributes:
      label: Related Issue
      description: Link the issue this PR addresses. Use "Fixes #123" to auto-close it.
      placeholder: "Fixes #"
    validations:
      required: false

  - type: checkboxes
    id: type_of_change
    attributes:
      label: Type of Change
      description: Check all that apply.
      options:
        - label: "Bug fix (non-breaking change that fixes an issue)"
        - label: "New feature (non-breaking change that adds functionality)"
        - label: "New tool (adds a new developer utility)"
        - label: "Breaking change (fix or feature that would cause existing functionality to change)"
        - label: "Refactor (code change that neither fixes a bug nor adds a feature)"
        - label: "Style / UI update (cosmetic changes, no logic change)"
        - label: "Documentation update"
        - label: "Performance improvement"
        - label: "Test update"

  - type: textarea
    id: changes_made
    attributes:
      label: Changes Made
      description: List the key changes. Be specific about files/components modified.
      value: |
        - 
        - 
        - 
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Recordings
      description: If your changes affect the UI, include before/after screenshots or a short recording.
      value: |
        | Before | After |
        |--------|-------|
        |        |       |

  - type: checkboxes
    id: testing
    attributes:
      label: How Has This Been Tested?
      description: Describe the testing you've done.
      options:
        - label: "Manual testing in browser (Chrome / Firefox / Safari / Edge)"
        - label: "`npm run build` passes with no errors"
        - label: "Tested on mobile viewport"
        - label: "Tested in both light and dark themes"
        - label: "Automated tests (if applicable)"

  - type: textarea
    id: test_details
    attributes:
      label: Test Details
      description: Provide specific steps if manual testing was done.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Ensure all items are checked before requesting review.
      options:
        - label: "My code follows the project's coding style and conventions"
        - label: "I have performed a self-review of my code"
        - label: "I have added comments in hard-to-understand areas"
        - label: "My changes do not introduce new warnings or console errors"
        - label: "I have updated documentation if needed"
        - label: "I have verified all existing functionality still works"
        - label: "My import paths are consistent with project conventions (`@/lib/`, `@/components/`)"
        - label: "New components are placed in the correct directory (feature-scoped under `components/<feature>/`)"

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Any context, trade-offs, or follow-up tasks worth mentioning.
